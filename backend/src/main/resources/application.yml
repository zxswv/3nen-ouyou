# 接続情報・秘密情報は環境変数で渡す（リポジトリに書かない）。
# 例は ../.env.example を参照。
server:
  port: 8080

spring:
  application:
    name: attendance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/attendance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    # テーブルは db/init.sql で作成する。Entity と食い違えば起動時にエラーにする。
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  geocoding:
    api-key: ${GEOCODING_API_KEY:}
